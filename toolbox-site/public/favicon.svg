<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Stick -->
  <rect x="46" y="80" width="8" height="20" rx="2" fill="#fdf0d5" stroke="#780000" stroke-width="1" />
  
  <!-- Candy Wrapper/Body Shadow -->
  <circle cx="50" cy="45" r="35" fill="#780000" opacity="0.1" />
  
  <!-- Main Candy Circle -->
  <circle cx="50" cy="45" r="35" fill="#c1121f" />
  
  <!-- Swirl Pattern -->
  <path d="M50 45 
           m 0 0
           l 0 -35
           a 35 35 0 0 1 0 70
           a 35 35 0 0 1 0 -70" 
        stroke="#fdf0d5" 
        stroke-width="12" 
        stroke-linecap="round"
        stroke-dasharray="20 15"
        opacity="0.9"
        fill="none" />
        
  <!-- Cute Shine -->
  <ellipse cx="35" cy="30" rx="6" ry="3" fill="#ffffff" opacity="0.6" transform="rotate(-45 35 30)" />
  <circle cx="42" cy="25" r="2" fill="#ffffff" opacity="0.6" />
</svg>
