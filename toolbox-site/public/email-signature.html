<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Email Signature</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="padding: 40px; font-family: sans-serif;">
    <h3>Email Signature Preview</h3>
    <p>Select everything inside the box below, copy it, and paste it into your email signature settings.</p>
    
    <div style="border: 1px dashed #ccc; padding: 20px; display: inline-block;">
        <!-- EMAIL SIGNATURE START -->
        <table cellpadding="0" cellspacing="0" border="0" style="font-family: 'DynaPuff', 'Verdana', sans-serif; color: #003049;">
            <tr>
                <td style="padding-bottom: 4px;">
                    <span style="font-family: 'DynaPuff', 'Comic Sans MS', cursive, sans-serif; font-size: 32px; font-weight: 700; color: #780000; line-height: 1.2;">Candice Shen</span>
                </td>
            </tr>
            <tr>
                <td style="padding-bottom: 12px;">
                    <span style="font-family: 'DynaPuff', 'Comic Sans MS', sans-serif; font-size: 18px; font-weight: 700; color: #003049; letter-spacing: -0.02em;">MBA at Yale School of Management</span>
                </td>
            </tr>
            
            <!-- Email Line -->
            <tr>
                <td style="padding-bottom: 4px;">
                    <table cellpadding="0" cellspacing="0" border="0">
                        <tr>
                            <td width="24" valign="middle" style="vertical-align: middle;">
                                <!-- Email Icon -->
                                <img src="https://cdn-icons-png.flaticon.com/512/542/542638.png" width="18" height="18" alt="email" style="display:block; border:0; opacity: 0.9;" />
                            </td>
                            <td valign="middle" style="vertical-align: middle;">
                                <a href="mailto:candice.shen@yale.edu" style="color: #003049; text-decoration: none; font-size: 16px; font-weight: 600; font-family: 'DynaPuff', 'Verdana', sans-serif;">candice.shen@yale.edu</a>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>

            <!-- LinkedIn Line -->
            <tr>
                <td style="padding-bottom: 4px;">
                    <table cellpadding="0" cellspacing="0" border="0">
                        <tr>
                            <td width="24" valign="middle" style="vertical-align: middle;">
                                <!-- LinkedIn Icon -->
                                <img src="https://cdn-icons-png.flaticon.com/512/61/61109.png" width="18" height="18" alt="linkedin" style="display:block; border:0; opacity: 0.9;" />
                            </td>
                            <td valign="middle" style="vertical-align: middle;">
                                <a href="https://linkedin.com/in/candiceshen" target="_blank" style="color: #003049; text-decoration: none; font-size: 16px; font-weight: 600; font-family: 'DynaPuff', 'Verdana', sans-serif;">linkedin.com/in/candiceshen</a>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>

            <!-- Website Line -->
            <tr>
                <td>
                    <table cellpadding="0" cellspacing="0" border="0">
                        <tr>
                            <td width="24" valign="middle" style="vertical-align: middle;">
                                <!-- Globe Icon -->
                                <img src="https://cdn-icons-png.flaticon.com/512/1006/1006771.png" width="18" height="18" alt="website" style="display:block; border:0; opacity: 0.9;" />
                            </td>
                            <td valign="middle" style="vertical-align: middle;">
                                <a href="https://candiceshen.com" target="_blank" style="color: #003049; text-decoration: none; font-size: 16px; font-weight: 600; font-family: 'DynaPuff', 'Verdana', sans-serif;">candiceshen.com</a>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
        <!-- EMAIL SIGNATURE END -->
    </div>
</body>
</html>
