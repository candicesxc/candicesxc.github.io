<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Work Samples - Candice Shen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&family=Lexend:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <div class="container">
            <div class="hero-section">
                <!-- Pixel art safe/vault -->
                <div class="safe-container">
                    <svg class="safe" viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">
                        <!-- Safe body -->
                        <rect x="20" y="40" width="160" height="160" fill="#669bbc"/>
                        <rect x="30" y="50" width="140" height="140" fill="#8ab4cf"/>
                        <!-- Safe door -->
                        <rect x="40" y="60" width="120" height="120" fill="#a8c9dd"/>
                        <rect x="45" y="65" width="110" height="110" fill="#bdd7e8"/>

                        <!-- Lock mechanism - bigger and more prominent -->
                        <circle cx="100" cy="125" r="35" fill="#669bbc"/>
                        <circle cx="100" cy="125" r="30" fill="#8ab4cf"/>

                        <!-- Lock icon container - much bigger -->
                        <g id="lock-icon">
                            <!-- Locked state -->
                            <g class="lock-locked">
                                <!-- Lock body -->
                                <rect x="85" y="130" width="30" height="25" fill="#ffd700" rx="2"/>
                                <!-- Shackle -->
                                <rect x="88" y="115" width="24" height="4" fill="#ffd700"/>
                                <rect x="88" y="110" width="4" height="9" fill="#ffd700"/>
                                <rect x="108" y="110" width="4" height="9" fill="#ffd700"/>
                                <rect x="92" y="106" width="16" height="4" fill="#ffd700"/>
                                <!-- Keyhole -->
                                <rect x="98" y="138" width="4" height="8" fill="#c1a000"/>
                                <rect x="96" y="138" width="8" height="4" fill="#c1a000"/>
                            </g>
                            <!-- Unlocked state -->
                            <g class="lock-unlocked">
                                <!-- Lock body -->
                                <rect x="85" y="130" width="30" height="25" fill="#51cf66" rx="2"/>
                                <!-- Shackle (open) -->
                                <rect x="88" y="115" width="24" height="4" fill="#51cf66"/>
                                <rect x="88" y="110" width="4" height="12" fill="#51cf66"/>
                                <rect x="108" y="115" width="4" height="6" fill="#51cf66"/>
                                <!-- Keyhole -->
                                <rect x="98" y="138" width="4" height="8" fill="#2d8e3e"/>
                                <rect x="96" y="138" width="8" height="4" fill="#2d8e3e"/>
                            </g>
                        </g>

                        <!-- Safe handle -->
                        <rect x="140" y="120" width="6" height="14" fill="#669bbc"/>
                        <rect x="146" y="122" width="10" height="10" fill="#669bbc" rx="5"/>

                        <!-- Decorative bolts -->
                        <circle cx="50" cy="70" r="3" fill="#669bbc"/>
                        <circle cx="150" cy="70" r="3" fill="#669bbc"/>
                        <circle cx="50" cy="170" r="3" fill="#669bbc"/>
                        <circle cx="150" cy="170" r="3" fill="#669bbc"/>
                    </svg>

                    <!-- Pixel art queen avatar -->
                    <div class="queen-avatar">
                        <svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
                            <!-- Tiara -->
                            <rect x="28" y="18" width="6" height="6" fill="#ffd700"/>
                            <rect x="40" y="14" width="6" height="10" fill="#ffd700"/>
                            <rect x="52" y="18" width="6" height="6" fill="#ffd700"/>
                            <rect x="34" y="24" width="18" height="4" fill="#ffd700"/>
                            <!-- Tiara gems -->
                            <rect x="42" y="17" width="3" height="3" fill="#ff69b4"/>
                            <circle cx="31" cy="21" r="2" fill="#ff69b4"/>
                            <circle cx="55" cy="21" r="2" fill="#ff69b4"/>

                            <!-- Head -->
                            <rect x="32" y="28" width="22" height="24" fill="#f4c2a0"/>

                            <!-- Hair (long, dark, flowing) -->
                            <rect x="26" y="28" width="6" height="40" fill="#2d1810"/>
                            <rect x="54" y="28" width="6" height="40" fill="#2d1810"/>
                            <rect x="22" y="40" width="4" height="35" fill="#2d1810"/>
                            <rect x="60" y="40" width="4" height="35" fill="#2d1810"/>
                            <rect x="26" y="68" width="34" height="10" fill="#2d1810"/>
                            <rect x="22" y="75" width="42" height="8" fill="#2d1810"/>

                            <!-- Eyes -->
                            <rect x="36" y="36" width="4" height="4" fill="#003049"/>
                            <rect x="46" y="36" width="4" height="4" fill="#003049"/>
                            <!-- Eye sparkles -->
                            <rect x="38" y="37" width="1" height="1" fill="#ffffff"/>
                            <rect x="48" y="37" width="1" height="1" fill="#ffffff"/>

                            <!-- Blush -->
                            <circle cx="35" cy="45" r="2" fill="#ffb3ba" opacity="0.6"/>
                            <circle cx="51" cy="45" r="2" fill="#ffb3ba" opacity="0.6"/>

                            <!-- Smile -->
                            <rect x="38" y="46" width="10" height="2" fill="#003049"/>
                            <rect x="38" y="44" width="2" height="2" fill="#003049"/>
                            <rect x="46" y="44" width="2" height="2" fill="#003049"/>

                            <!-- Body (dress) -->
                            <rect x="30" y="52" width="26" height="30" fill="#ff69b4"/>
                            <rect x="28" y="56" width="30" height="26" fill="#ffb3d9"/>
                            <!-- Dress details -->
                            <rect x="32" y="60" width="4" height="4" fill="#ff69b4"/>
                            <rect x="40" y="60" width="4" height="4" fill="#ff69b4"/>
                            <rect x="48" y="60" width="4" height="4" fill="#ff69b4"/>
                        </svg>
                    </div>
                </div>
            </div>

            <div class="content-section">
                <header>
                    <div id="greeting" class="greeting" role="status"></div>
                    <h1>Thanks for taking a look at my work samples</h1>
                    <p class="subhead">These are shared as view only for work conversations.</p>
                </header>

                <section class="controls">
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="confirm-checkbox" aria-describedby="helper-text">
                            <span class="checkbox-custom"></span>
                            <span class="checkbox-text">I'll use these samples for evaluation only and won't share the link.</span>
                        </label>
                        <p id="helper-text" class="helper-text">If you want to loop in someone else, just ask me and I'll share the right way.</p>
                    </div>

                    <div class="error-message" id="error-message" role="alert" aria-live="polite"></div>

                    <button id="unlock-button" class="unlock-button" disabled aria-label="Unlock and view work samples">
                        <span class="button-text">Unlock and view samples</span>
                    </button>

                    <a href="/" class="secondary-link" target="_blank" rel="noopener noreferrer">Visit my public portfolio</a>
                </section>

                <footer>
                    <p class="footer-text">Trouble accessing the folder? <a href="mailto:candice.shen@yale.edu">Email me</a></p>
                </footer>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
